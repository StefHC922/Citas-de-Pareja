<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Adquisición de Experiencias</title>
<meta name="theme-color" content="#120e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120e1c; --bg-2:#1a1428; --card:#201933; --card-border:#322a4a;
    --fg:#f4f1fb; --fg-muted:#a599c7; --coral:#ff6a5c; --teal:#2fd9c7; --rojo:#ff5c7a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; width:100%; color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;
    background:radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%), var(--bg); }
  body{ min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:max(66px, calc(env(safe-area-inset-top) + 30px)) 20px max(28px, env(safe-area-inset-bottom)); }
  .back{ position:absolute; top:max(20px, env(safe-area-inset-top)); left:20px;
    font-family:'Chakra Petch',sans-serif; font-size:.85rem; color:var(--fg-muted); text-decoration:none; }
  .eyebrow{ font-family:'Chakra Petch',sans-serif; font-size:.8rem; letter-spacing:.3em;
    text-transform:uppercase; color:var(--fg-muted); margin-bottom:10px; }
  h1{ font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:1.8rem; margin:0 0 8px; text-align:center;
    background:linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.desc{ font-size:.88rem; color:var(--fg-muted); max-width:380px; margin:0 0 18px; text-align:center; }
  .pack{ width:100%; max-width:420px; background:var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:16px; margin-bottom:12px; }
  .pack h3{ font-family:'Chakra Petch',sans-serif; margin:0 0 4px; font-size:1.05rem; }
  .pack .d{ font-size:.85rem; color:var(--fg-muted); margin:0 0 12px; }
  .pack .estado{ font-size:.8rem; margin-bottom:10px; }
  .pack .estado.ok{ color:var(--teal); }
  .tabsTienda{ display:flex; flex-direction:column; gap:12px; margin-bottom:18px; width:100%; max-width:420px; }
  .tabsTienda button{ display:flex; align-items:center; gap:16px; width:100%;
    font-family:'Chakra Petch',sans-serif; padding:20px; border-radius:16px; cursor:pointer;
    border:1px solid var(--card-border); background:var(--card); color:var(--fg); text-align:left; }
  .tabsTienda button:active{ transform:scale(.97); border-color:var(--teal); }
  .tabsTienda button.activo{ border-color:var(--teal); }
  .tabsTienda .icon{ font-size:2rem; }
  .tabsTienda .label{ flex:1; }
  .tabsTienda .title{ font-weight:700; font-size:1.05rem; }
  .tabsTienda .subtitle{ font-size:.82rem; color:var(--fg-muted); margin-top:2px; font-family:'Inter',sans-serif; }
  .nuevo{ float:right; font-size:.68rem; font-weight:700; color:var(--bg);
    background:linear-gradient(90deg, var(--coral), var(--teal));
    border-radius:8px; padding:2px 8px; margin-left:8px; vertical-align:middle; }
  .subTituloSec{ width:100%; max-width:420px; font-family:'Chakra Petch',sans-serif; font-size:.85rem; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; color:var(--fg); margin:6px 0 12px; text-align:center; }
  .btnSecTienda{ background:none; border:none; color:var(--fg-muted); font-size:.85rem; cursor:pointer;
    font-family:'Chakra Petch',sans-serif; padding:8px; margin-bottom:6px; text-decoration:underline; }
  .btn{ width:100%; border:none; border-radius:12px; cursor:pointer; padding:13px;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.92rem; color:var(--bg);
    background:linear-gradient(90deg, var(--coral), var(--teal)); text-decoration:none;
    display:block; text-align:center; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.4; }
  .btn.ghost{ background:var(--bg-2); color:var(--fg); border:1px solid var(--card-border); }
  #msg{ min-height:20px; font-size:.85rem; color:var(--rojo); margin:6px 0; text-align:center; max-width:420px; }
  h1.chico{ font-size:1.4rem; }
  #btnCasa{
    position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px;
    background:none; border:none; color:var(--fg-muted); font-size:.85rem; cursor:pointer;
    font-family:'Chakra Petch',sans-serif; padding:4px;
  }
</style>
</head>
<body>

<button id="btnCasa" type="button">← Inicio</button>

<h1 id="tituloPag">Adquisición de Experiencias</h1>
<p class="desc" id="descPag">Complicidad en Pareja</p>
<div id="msg"></div>
<div class="tabsTienda" id="botonesSec">
  <button data-sec="experiencias" type="button">
    <span class="icon">💑</span>
    <span class="label"><div class="title">Experiencias en Pareja</div>
    <div class="subtitle">Citas y momentos para compartir</div></span>
  </button>
  <button data-sec="juegos" type="button">
    <span class="icon">🎮</span>
    <span class="label"><div class="title">Juegos</div>
    <div class="subtitle">Para divertirse juntos</div></span>
  </button>
  <button data-sec="extras" type="button">
    <span class="icon">✨</span>
    <span class="label"><div class="title">Extras</div>
    <div class="subtitle">Lo que vaya llegando</div></span>
  </button>
</div>
<div id="vistaSec" style="display:none;width:100%;flex-direction:column;align-items:center;">
  <button class="btnSecTienda" id="btnVolverSec" type="button">‹ Centro de Adquisiciones</button>
  <div id="listaSec" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>
</div>
<div id="lista" style="width:100%;display:flex;flex-direction:column;align-items:center;"></div>

<script type="module">
import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import { verificarCodigo, verificarFirma } from "../taquilla.js";
// Lógica de licencias compartida con el resto de la app (ver acceso.js).
import { miProyecto, appTaq, leerLicencias, guardarLicencias, tieneCodigoValido, escucharCatalogo, nuevosSinPedir } from "../acceso.js";

// miProyecto, appTaq, leerLicencias, guardarLicencias, tieneCodigoValido y
// escucharCatalogo ahora vienen de ../acceso.js (logica compartida).
// NOTA: graciaDisponible() mas abajo sigue con su propia consulta porque
// necesita ESCRIBIR graciaUsada en el documento; ver Problemas 2.txt.
let usuarioGoogle = null;
let packsCache = [];
const SEC_NOMBRES = { experiencias: "💑 Experiencias en Pareja", juegos: "🎮 Juegos", extras: "✨ Extras" };
const SEC_DESC = { experiencias: "Material de Apoyo para tu cita", juegos: "Diviértete en esa cita especial", extras: "Retos que te llevarán a otro nivel" };
let secActual = null;
try{ secActual = new URLSearchParams(location.search).get("sec"); }catch(e){}
document.getElementById("btnCasa").onclick = ()=>{ location.href = "../index.html"; };
if(SEC_NOMBRES[secActual]){
  document.getElementById("botonesSec").style.display = "none";
  document.getElementById("vistaSec").style.display = "flex";
  document.getElementById("btnCasa").style.display = "none";
  const tp = document.getElementById("tituloPag");
  tp.textContent = SEC_NOMBRES[secActual];
  document.getElementById("descPag").textContent = SEC_DESC[secActual];
}else{
  document.getElementById("vistaSec").style.display = "none";
}
document.querySelectorAll("#botonesSec button").forEach(b=>{
  b.onclick = ()=>{ location.href = "?sec=" + b.getAttribute("data-sec"); };
});
document.getElementById("btnVolverSec").onclick = ()=>{ location.href = location.pathname; };
const listaEl = document.getElementById("lista");
const msgEl = document.getElementById("msg");
function msg(t){ msgEl.textContent = t || ""; }

// licenciaValida() ahora es tieneCodigoValido() de ../acceso.js.
/** Cortesía: vencido con firma válida y graciaUsada==false en servidor. */
async function graciaDisponible(item){
  try{
    const cod = leerLicencias()[item];
    if(!cod) return null;
    const estricto = await verificarCodigo(cod);
    if(estricto) return null;
    const pay = await verificarFirma(cod);
    if(!pay || pay.item !== item || pay.para !== miProyecto()) return null;
    if(!(pay.vence && Date.now() > pay.vence)) return null;
    const tdb = getFirestore(appTaq());
    const snap = await getDocs(query(collection(tdb, "solicitudes"), where("para", "==", miProyecto())));
    let mejor = null;
    snap.forEach(dd=>{
      const s = dd.data();
      if(s.item !== item) return;
      if(String(s.email || "").trim().toLowerCase() !== String(pay.email || "").trim().toLowerCase()) return;
      if(s.estado !== "aprobado" || s.graciaUsada !== false) return;
      mejor = { id: dd.id, s };
    });
    return mejor;
  }catch(e){ return null; }
}

// Candado de dibujado: impide que dos pintadas corran a la vez y encimen
// las tarjetas (pasaba al cargar, porque el listener pedia otra pintada casi
// al mismo tiempo). Si llega una mientras se dibuja, se anota y se repite.
let pintando = false;
let pintarPendiente = false;
async function pintar(){
  if(pintando){ pintarPendiente = true; return; }
  pintando = true;
  try{
    do{
      pintarPendiente = false;
      await pintarDeVerdad();
    }while(pintarPendiente);
  }finally{ pintando = false; }
}
async function pintarDeVerdad(){
  listaEl.innerHTML = "";
  packsCache = [];
  try{
    const tdb = getFirestore(appTaq());
    const snap = await getDocs(collection(tdb, "packs"));
    snap.forEach(d=>packsCache.push(Object.assign({ id: d.id }, d.data())));
  }catch(e){
    msg("No se pudo cargar el catálogo. Revisa tu conexión.");
    return;
  }
  if(!packsCache.length){
    await marcarSecNuevas();      // sin packs, quita cualquier distintivo viejo
    listaEl.innerHTML = '<p class="desc">Aún no hay nada publicado.</p>';
    return;
  }
  await marcarSecNuevas();
  await pintarDesdeCache();
}
// Distintivo NUEVO en los botones de las secciones, para que se vea DE LEJOS
// en qué categoría hay algo nuevo sin pedir. El criterio vive en acceso.js
// (fecha "Nuevo" viva Y sin solicitud).
async function marcarSecNuevas(){
  let cuenta = { experiencias: 0, juegos: 0, extras: 0 };
  try{
    const nuevos = await nuevosSinPedir(packsCache);
    Object.keys(nuevos).forEach(id=>{
      const p = packsCache.find(x=> x.id === id);
      if(!p) return;
      const sec = p.seccion || "experiencias";
      if(cuenta[sec] !== undefined) cuenta[sec]++;
    });
  }catch(e){}
  document.querySelectorAll("#botonesSec button").forEach(b=>{
    const t = b.querySelector(".title");
    if(!t) return;
    const tag = t.querySelector(".nuevo");
    if(cuenta[b.getAttribute("data-sec")] > 0){
      if(!tag){
        const n = document.createElement("span");
        n.className = "nuevo";
        n.textContent = "NUEVO";
        t.appendChild(n);
      }
    }else if(tag){
      tag.remove();
    }
  });
}
async function pintarDesdeCache(){
  const cont = SEC_NOMBRES[secActual] ? document.getElementById("listaSec") : listaEl;
  cont.innerHTML = "";
  if(!SEC_NOMBRES[secActual]) return;
  if(!packsCache.length){
    cont.innerHTML = '<p class="desc">Aún no hay nada publicado.</p>';
    return;
  }
  const grupos = [{ id: secActual, titulo: SEC_NOMBRES[secActual] }];
  for(const g of grupos){
    if(!SEC_NOMBRES[secActual]){
      const h = document.createElement("div");
      h.textContent = g.titulo;
      h.style.cssText = "width:100%;max-width:420px;font-family:'Chakra Petch',sans-serif;font-size:.8rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--fg-muted);margin:14px 0 12px;";
      cont.appendChild(h);
    }
    const items = packsCache.filter(p=>(p.seccion || "experiencias") === g.id);
    items.sort((a, b)=>((a.orden ?? 10) - (b.orden ?? 10)) || String(a.titulo || a.id || "").localeCompare(String(b.titulo || b.id || "")));
    if(!items.length){
      const v = document.createElement("p");
      v.className = "desc";
      v.textContent = "Nada aquí todavía.";
      cont.appendChild(v);
      continue;
    }
    for(const p of items){
      cont.appendChild(await tarjetaPack(p));
    }
  }
}
async function tarjetaPack(p){
    const div = document.createElement("div");
    div.className = "pack";
    const h = document.createElement("h3");
    h.textContent = (p.icono || "🎁") + " " + (p.titulo || p.id);
    try{
      const nh = p.nuevoHasta && p.nuevoHasta.toDate ? p.nuevoHasta.toDate().getTime() : 0;
      if(nh && Date.now() < nh){
        const nb = document.createElement("span");
        nb.className = "nuevo";
        nb.textContent = "NUEVO";
        h.appendChild(nb);
      }
    }catch(e){}
    const d = document.createElement("p");
    d.className = "d";
    d.textContent = p.desc || "";
    const est = document.createElement("div");
    est.className = "estado";
    const btn = document.createElement("button");
    div.appendChild(h); div.appendChild(d); div.appendChild(est); div.appendChild(btn);
    if(await tieneCodigoValido(p.id)){
      est.className = "estado ok";
      est.textContent = "✅ Se agregó a tu menú";
      btn.className = "btn ghost";
      btn.textContent = "Abrir";
      btn.onclick = ()=>{ location.href = "../" + (p.ruta || "") + "/"; };
    }else if(await graciaDisponible(p.id)){
      est.className = "estado ok";
      est.textContent = "⏳ Venció, pero tienen último acceso disponible";
      btn.className = "btn";
      btn.textContent = "Abrir última vez";
      btn.onclick = ()=>{ location.href = "../" + (p.ruta || "") + "/"; };
    }else{
      est.textContent = "🔒 Sin acceso";
      btn.className = "btn";
      btn.textContent = "Pedir acceso";
      btn.onclick = ()=>pedir(p, btn, est);
    }
    return div;
}

async function pedir(p, btn, est){
  msg("");
  try{
    if(!usuarioGoogle){
      const res = await signInWithPopup(getAuth(appTaq()), new GoogleAuthProvider());
      usuarioGoogle = res.user;
    }
    btn.disabled = true;
    const email = String(usuarioGoogle.email || "").trim().toLowerCase();
    const tdb = getFirestore(appTaq());
    // Evita duplicados: reutiliza la misma solicitud por correo+juego
    let prev = null;
    try{
      const snap = await getDocs(query(collection(tdb, "solicitudes"), where("para", "==", miProyecto())));
      const mios = [];
      snap.forEach(dd=>{
        const s = dd.data();
        if(s.item === p.id && String(s.email || "").trim().toLowerCase() === email) mios.push({ id: dd.id, s });
      });
      mios.sort((a, b)=>{
        const fa = a.s.fecha, fb = b.s.fecha;
        const ta = fa && fa.toDate ? fa.toDate().getTime() : 0;
        const tb = fb && fb.toDate ? fb.toDate().getTime() : 0;
        return tb - ta;
      });
      prev = mios[0] || null;
    }catch(e){}
    if(prev){
      const es = prev.s.estado || "pendiente";
      if(es === "aprobado" && prev.s.codigo){
        try{
          const pay = await verificarCodigo(prev.s.codigo);
          if(pay && pay.para === miProyecto() && pay.item === p.id){
            const lic = leerLicencias();
            lic[p.id] = String(prev.s.codigo).trim();
            guardarLicencias(lic);
            est.textContent = "✅ Ya tienes acceso. Se agregó a tu menú.";
            pintar();
            btn.disabled = false;
            return;
          }
        }catch(e){}
      }
      if(es === "pendiente"){
        est.textContent = "⏳ Ya la pediste. En cuanto se apruebe se activa sola.";
        escuchar(p.id);
        btn.disabled = false;
        return;
      }
      // revocado o negado: no crea otra, pide quitar revocación sobre la misma
      try{
        await updateDoc(doc(tdb, "solicitudes", prev.id), {
          estado: "pendiente",
          fecha: serverTimestamp(),
          quien: usuarioGoogle.displayName || prev.s.quien || "?",
          intentos: (prev.s.intentos || 1) + 1,
          pideDesrevocar: true
        });
      }catch(e){
        est.textContent = "No se pudo reenviar. Revisa tu conexión.";
        btn.disabled = false;
        return;
      }
      est.textContent = "⏳ Pediste quitar la revocación. En cuanto se re-apruebe se activa sola.";
      escuchar(p.id);
      btn.disabled = false;
      return;
    }
    await addDoc(collection(tdb, "solicitudes"), {
      para: miProyecto(), item: p.id,
      quien: usuarioGoogle.displayName || "?",
      email: email,
      estado: "pendiente", fecha: serverTimestamp(), intentos: 1
    });
    est.textContent = "⏳ Solicitud enviada. Al aprobarse se activará en tu menú.";
    escuchar(p.id);
  }catch(e){
    msg("No se pudo pedir. Revisa conexión o ventanas emergentes.");
  }
  btn.disabled = false;
}

// La revalidacion de todo el catalogo vive en acceso.js. Aqui solo se
// decide que hacer cuando cambian los codigos: redibujar las tarjetas.
let stopEscucha = null;
function escuchar(){
  stopEscucha = escucharCatalogo({ cambio(){ pintar(); } });
}

pintar();
escuchar();
</script>

</body>
</html>

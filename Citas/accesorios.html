<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Actividades y Accesorios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --rojo: #ff5c7a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%; width:100%;
    color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; padding:max(66px, calc(env(safe-area-inset-top) + 30px)) 20px max(28px, env(safe-area-inset-bottom));
    position:relative;
  }

  /* El "Volver" va arriba a la DERECHA en toda la app (regla de la casa). El ⚙️ del
     menú y el de Experiencias ocupan la IZQUIERDA, así que el lado libre es este. */
  .back{
    position:absolute; top:max(20px, env(safe-area-inset-top)); right:20px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:500;
    color: var(--fg-muted); text-decoration:none;
  }
  .back:hover{ color: var(--fg); }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.8rem; letter-spacing:.3em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:10px;
  }
  h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 8px; text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.desc{
    font-size:.88rem; color:var(--fg-muted); max-width:340px; margin:0 0 18px; text-align:center;
  }

  .tabs{ display:flex; gap:10px; margin-bottom:22px; }
  .tabs a{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); text-decoration:none;
    padding:10px 18px; border-radius:12px;
    border:1px solid var(--card-border); background: var(--card);
  }
  .tabs a.activo, .tabs button.activo{ color: var(--teal); border-color: var(--teal); }
  .tabs button{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); padding:10px 18px; border-radius:12px; cursor:pointer;
    border:1px solid var(--card-border); background: var(--card);
  }
  .panel{ display:none; width:100%; max-width:520px; margin:0 0 16px;
    background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:18px; }
  .panel.ver{ display:block; }
  [hidden]{ display:none !important; }

  #alta{
    width:100%; max-width:420px; margin-bottom:6px;
  }
  #alta .fila{ display:flex; gap:10px; }
  #alta input{
    font-family:'Inter', sans-serif; flex:1; min-width:0;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
    padding:14px; font-size:1rem;
  }
  #btnAgregar{
    font-family:'Chakra Petch', sans-serif; font-weight:700; letter-spacing:.04em;
    border:none; border-radius:14px; cursor:pointer; padding:14px 20px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    transition: transform .15s ease, opacity .2s ease;
    white-space:nowrap;
  }
  #btnAgregar:active{ transform: scale(.97); }
  #btnAgregar:disabled{ opacity:.4; }
  #btnAgregar.eliminar{ background: var(--rojo); color:#2b0410; }

  /* Los tres bloques de arriba (campo, mensaje y conteo) van juntos: en el celular
     sobraba un hueco grande entre el campo del accesorio y la lista. El `min-height`
     del mensaje se queda para que al salir un aviso la lista NO salte de lugar. */
  #msg{
    min-height:20px; font-size:.85rem; color:var(--rojo);
    margin:0 0 8px; text-align:center; max-width:420px;
  }
  #msg.ok{ color: var(--teal); }

  #conteo{
    font-size:.8rem; color:var(--fg-muted); opacity:.8; margin-bottom:6px;
  }

  #lista{
    width:100%; max-width:520px;
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .item{
    background: var(--card); border:1px solid var(--card-border);
    border-radius:12px; padding:14px 12px;
    font-size:1.02rem; text-align:center; cursor:pointer;
    font-family:'Chakra Petch',sans-serif; font-weight:600;
    word-break:break-word;
    transition: transform .15s ease, border-color .2s ease;
  }
  .item:active{ transform: scale(.98); border-color: var(--teal); }
  .item.nuevo{ border-color: var(--teal); }
  .seccionCfg{ width:100%; max-width:520px; margin:30px 0 6px; text-align:center; }
  .seccionCfg h2{ font-family:'Chakra Petch',sans-serif; font-size:1.1rem; margin:0 0 6px; }
  .seccionCfg .mini{ font-size:.82rem; color:var(--fg-muted); margin:0 0 12px; }
  #listaUsuariosCfg{ display:flex; flex-direction:column; gap:10px; }
  #listaUsuariosCfg button{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; color:var(--fg); padding:12px; font-size:.95rem; font-family:'Chakra Petch',sans-serif; cursor:pointer; }
  #listaUsuariosCfg button.yo{ border-color:var(--teal); }
  #qrCajaCfg{ background:#fff; padding:12px; border-radius:14px; display:none; justify-content:center; margin:0 auto 12px; width:fit-content; }
  .btnCfg{ font-family:'Chakra Petch',sans-serif; font-weight:700; border:none; border-radius:12px; cursor:pointer; padding:12px 22px; color:var(--bg); background:linear-gradient(90deg, var(--coral), var(--teal)); }
  .btnCfg:active{ transform:scale(.97); }
  .filaCfg{ display:flex; gap:8px; margin-top:12px; }
  .filaCfg input{ flex:1; min-width:0; border-radius:12px; border:1px solid var(--card-border);
    background:var(--bg); color:var(--fg); padding:12px; font-size:.95rem; font-family:'Inter',sans-serif; }
  /* Regreso al editor de la actividad: solo sale si se entro desde ahi. */
  #volverAct{
    display:none; width:100%; max-width:520px; margin:0 0 18px; padding:14px 16px;
    background: var(--card); border:1px solid var(--teal); border-radius:14px;
    color:var(--fg); text-decoration:none; text-align:left;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:.95rem;
  }
  #volverAct.ver{ display:block; }
  #volverAct:active{ transform: scale(.98); }
  #volverAct b{ color: var(--teal); }
</style>
</head>
<body>

<a class="back" id="lnkInicio" href="../index.html">← Volver</a>

<div class="eyebrow">Configuración</div>
<h1 id="tituloCfg">Actividades y Accesorios</h1>
<p class="desc" id="descCfg">Elige una opción para configurar tu app.</p>

<div class="tabs">
  <a href="actividades.html">Actividades</a>
  <button id="tabLista" type="button">Accesorios</button>
</div>

<a id="volverAct" href="actividades.html">‹ Volver a la actividad <b id="volverActNombre"></b></a>

<div id="alta">
  <div class="fila">
    <input id="nombreNuevo" type="text" placeholder="Nombre del accesorio" maxlength="60" autocomplete="off">
    <button id="btnAgregar">Agregar</button>
  </div>
</div>

<div id="msg"></div>
<div id="conteo" hidden></div>
<div id="lista" hidden></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

import firebaseConfigBase from "../firebase-config.js";
import { resolverFirebase, leerConfigGuardada, cargarUsuarios, asegurarFabrica } from "../config.js";
import { confirmar } from "../confirmar.js";
import { montarFavor } from "../favor.js";
try{ montarFavor(); }catch(e){}
const firebaseConfig = resolverFirebase(firebaseConfigBase);

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const extrasRef = collection(db, "accesoriosExtra");

// ====== ESTADO ======
const listaEl = document.getElementById("lista");
const conteoEl = document.getElementById("conteo");
const msgEl = document.getElementById("msg");
const inputEl = document.getElementById("nombreNuevo");
const btnAgregar = document.getElementById("btnAgregar");

let catalogo = [];  // del JSON: solo instalador; si ya se sembro, va vacio
let extras = [];    // de Firebase: [{id, nombre}] (todo se puede eliminar)

let modo = "agregar";   // "agregar" | "eliminar"
let docObjetivo = null;

function normalizar(s){
  return (s || "").trim().toLowerCase();
}

function nombresCatalogo(){
  return new Set(catalogo.map(normalizar));
}

function listaCombinada(){
  const vistos = new Set();
  const salida = [];
  catalogo.concat(extras.map(e=>e.nombre)).forEach(n=>{
    const clave = normalizar(n);
    if(clave && !vistos.has(clave)){
      vistos.add(clave);
      salida.push(n.trim());
    }
  });
  return salida.sort((a,b)=>a.localeCompare(b,"es"));
}

function buscarExtra(clave){
  return extras.find(e=>normalizar(e.nombre) === clave) || null;
}

function pintar(){
  const todos = listaCombinada();
  const nombresExtras = new Set(extras.map(e=>normalizar(e.nombre)));
  listaEl.innerHTML = "";
  todos.forEach(n=>{
    const div = document.createElement("div");
    div.className = "item" + (nombresExtras.has(normalizar(n)) ? " nuevo" : "");
    div.textContent = n;
    // Tocar uno lleva su nombre al campo de arriba: asi, si es de los que se
    // pueden borrar, el boton cambia a "Eliminar" sin tener que escribirlo.
    div.onclick = ()=>{
      inputEl.value = n;
      actualizarModo();
      try{ inputEl.focus(); }catch(e){}
      try{ window.scrollTo(0, 0); }catch(e){}
    };
    listaEl.appendChild(div);
  });
  conteoEl.textContent = todos.length + (todos.length === 1 ? " accesorio" : " accesorios");
}

// Si lo escrito coincide con uno agregado desde la app,
// el botón se convierte en "Eliminar".
function actualizarModo(){
  const clave = normalizar(inputEl.value);

  if(!clave){
    modo = "agregar";
    docObjetivo = null;
    btnAgregar.textContent = "Agregar";
    btnAgregar.classList.remove("eliminar");
    btnAgregar.disabled = true;          // vacio: no se puede agregar
    msgEl.textContent = "";
    msgEl.className = "";
    return;
  }

  const extra = buscarExtra(clave);
  if(extra){
    modo = "eliminar";
    docObjetivo = extra.id;
    btnAgregar.textContent = "Eliminar";
    btnAgregar.classList.add("eliminar");
    btnAgregar.disabled = false;         // si existe: se puede eliminar
    msgEl.textContent = "";
    msgEl.className = "";
    return;
  }

  modo = "agregar";
  docObjetivo = null;
  btnAgregar.textContent = "Agregar";
  btnAgregar.classList.remove("eliminar");

  if(nombresCatalogo().has(clave)){
    msgEl.textContent = "Ese accesorio ya existe.";
    msgEl.className = "";
    btnAgregar.disabled = true;          // repetido: no se puede agregar
  }else{
    msgEl.textContent = "";
    msgEl.className = "";
    btnAgregar.disabled = false;         // nombre nuevo: si
  }
}

function avisar(texto, ok){
  msgEl.textContent = texto;
  msgEl.className = ok ? "ok" : "";
}

async function cargar(){
  // 1) La fabrica: los JSON del repo. Solo sirven para instalar.
  //    Se leen los dos aunque esta pantalla solo use accesorios: el instalador
  //    corre una sola vez, asi que la pantalla que abra primero debe sembrar todo.
  let fabricaAct = [];
  let fabricaAcc = [];
  try{
    const data = await (await fetch("actividades.json")).json();
    if(Array.isArray(data)) fabricaAct = data;
  }catch(e){}
  try{
    const data = await (await fetch("accesorios.json")).json();
    if(Array.isArray(data)) fabricaAcc = data;
  }catch(e){}
  catalogo = fabricaAcc;

  // 2) Una sola vez se copia la fabrica a la base. Si ya quedo ahi, la base
  //    manda: lo de fabrica se vuelve tuyo y se renombra y borra de verdad.
  const sembrado = await asegurarFabrica(db, { actividades: fabricaAct, accesorios: fabricaAcc });
  if(sembrado){
    catalogo = [];
  }

  // 3) Tu base, que ya incluye lo que se instalo.
  try{
    const snap = await getDocs(extrasRef);
    extras = [];
    snap.forEach(d=>{
      const n = d.data().nombre;
      if(n) extras.push({ id: d.id, nombre: n });
    });
  }catch(e){
    extras = [];
  }

  pintar();
  actualizarModo();
}

async function agregar(){
  const nombre = inputEl.value.trim();
  if(!nombre){
    avisar("Escribe el nombre del accesorio.");
    return;
  }

  const clave = normalizar(nombre);
  const existe = listaCombinada().some(n=>normalizar(n) === clave);
  if(existe){
    avisar("Ese accesorio ya existe.");
    return;
  }

  btnAgregar.disabled = true;
  try{
    const ref = await addDoc(extrasRef, { nombre: nombre, creadoEn: serverTimestamp() });
    extras.push({ id: ref.id, nombre: nombre });
    pintar();
    inputEl.value = "";
    inputEl.focus();
    actualizarModo();
    avisar("Accesorio agregado.", true);
  }catch(e){
    avisar("No se pudo guardar. Revisa tu conexión.");
  }
  actualizarModo();   // decide si el boton queda activo o apagado
}

async function eliminar(){
  if(!docObjetivo) return;

  const cual = inputEl.value.trim();
  const confirmado = await confirmar({
    aviso: true,
    titulo: "¿Eliminar el accesorio «" + cual + "»?",
    texto: "No se puede deshacer.",
    ok: "Eliminar"
  });
  if(!confirmado) return;

  btnAgregar.disabled = true;
  try{
    await deleteDoc(doc(db, "accesoriosExtra", docObjetivo));
    extras = extras.filter(e=>e.id !== docObjetivo);
    pintar();
    inputEl.value = "";
    inputEl.focus();
    actualizarModo();
    avisar("Accesorio eliminado.", true);
  }catch(e){
    avisar("No se pudo eliminar. Revisa tu conexión.");
  }
  actualizarModo();
}

btnAgregar.onclick = ()=>{
  if(modo === "eliminar"){
    eliminar();
  }else{
    agregar();
  }
};
inputEl.addEventListener("input", actualizarModo);
inputEl.addEventListener("keydown", e=>{
  if(e.key === "Enter") btnAgregar.onclick();
});

// ====== PANELES (lista) — Usuarios y Vincular viven en el ⚙️ del inicio ======
const tabLista = document.getElementById("tabLista");
function todosApagados(){
  [tabLista].forEach(b=>b.classList.remove("activo"));
  listaEl.hidden = true;
  conteoEl.hidden = true;
  document.getElementById("alta").style.display = "";
  document.getElementById("tituloCfg").textContent = "Actividades y Accesorios";
  document.getElementById("descCfg").textContent = "Elige una opción para configurar tu app.";
}
function ponerTitulo(t, d){
  document.getElementById("tituloCfg").textContent = t;
  document.getElementById("descCfg").textContent = d;
}
tabLista.onclick = ()=>{
  const abierto = tabLista.classList.contains("activo");
  todosApagados();
  if(!abierto){
    tabLista.classList.add("activo");
    ponerTitulo("Accesorios", "Agrega tus Accesorios. Los guardas y estás listo para esa cita Especial.");
    listaEl.hidden = false;
    conteoEl.hidden = false;
  }
};

// Si se entro desde el editor de una actividad, se ofrece el regreso a esa misma
// ventana para seguir asignando accesorios. La nota la guarda actividades.html y
// se borra alla cuando se vuelve, asi que no se queda pegada para siempre.
(function(){
  let vuelta = null;
  try{ vuelta = JSON.parse(sessionStorage.getItem("citasIrAccesorios") || "null"); }catch(e){}
  if(!vuelta || !vuelta.n) return;
  if(Date.now() - (vuelta.t || 0) > 21600000) return;   // mas de 6 h: ya no aplica
  document.getElementById("volverActNombre").textContent = "«" + vuelta.n + "»";
  document.getElementById("volverAct").classList.add("ver");
})();

// ====== EL "← VOLVER" ======
// Va arriba a la DERECHA (regla de la casa) y se va a la pantalla DE DONDE SE VINO,
// no al menú. Aquí se llega de dos maneras y el mismo `history.back()` cubre las
// dos:
//   - Desde el editor de una actividad ("Administrar accesorios"). Al volver,
//     `actividades.html` encuentra la nota y reabre ESA misma actividad.
//   - Desde el ⚙️ del menú o el de Experiencias: se vuelve a esa pantalla.
// Con el `href` fijo a `../index.html` se caía siempre al menú, y eso no era "atrás".
// Si no hay a dónde atrás (se escribió la dirección a mano), ahí sí va al menú.
// OJO: la otra salida de esta pantalla, `#volverAct` ("Volver a la actividad «X»"),
// NO se toca: es un atajo que además lleva el nombre de la actividad. Ver el aviso
// de por qué aquí abajo hay dos.
document.getElementById("lnkInicio").addEventListener("click", (e)=>{
  e.preventDefault();
  if(history.length > 1){ history.back(); return; }
  location.href = "../index.html";
});

cargar();
tabLista.onclick();
// OJO: aquí NO se enfoca el campo del accesorio, igual que en `actividades.html`.
// En el CELULAR eso abre el teclado de una vez al entrar y tapa media pantalla sin
// que nadie haya pedido escribir. Los otros tres `focus()` de esta pantalla SI se
// quedan: al tocar un accesorio de la lista, y después de agregar o eliminar.

</script>

</body>
</html>

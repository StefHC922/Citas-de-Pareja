<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Actividades</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --bg: #120e1c;
    --bg-2: #1a1428;
    --card: #201933;
    --card-border: #322a4a;
    --fg: #f4f1fb;
    --fg-muted: #a599c7;
    --coral: #ff6a5c;
    --teal: #2fd9c7;
    --rojo: #ff5c7a;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; min-height:100%; width:100%;
    color:var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 100% 30%, #1c1330, transparent 45%),
      var(--bg);
  }
  body{
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; padding:max(66px, calc(env(safe-area-inset-top) + 30px)) 20px max(28px, env(safe-area-inset-bottom));
    position:relative;
  }

  .back{
    position:absolute; top:max(20px, env(safe-area-inset-top)); left:20px;
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:500;
    color: var(--fg-muted); text-decoration:none;
  }
  .back:hover{ color: var(--fg); }

  .eyebrow{
    font-family:'Chakra Petch', sans-serif;
    font-size:.8rem; letter-spacing:.3em; text-transform:uppercase;
    color: var(--fg-muted); margin-bottom:10px;
  }
  h1{
    font-family:'Chakra Petch', sans-serif;
    font-weight:700; font-size:1.8rem; margin:0 0 8px; text-align:center;
    background: linear-gradient(90deg, var(--coral), var(--teal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.desc{
    font-size:.88rem; color:var(--fg-muted); max-width:340px; margin:0 0 18px; text-align:center;
  }

  .tabs{ display:flex; gap:10px; margin-bottom:22px; }
  .tabs a{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); text-decoration:none;
    padding:10px 18px; border-radius:12px;
    border:1px solid var(--card-border); background: var(--card);
  }
  .tabs a.activo, .tabs button.activo{ color: var(--teal); border-color: var(--teal); }
  .tabs button{
    font-family:'Chakra Petch', sans-serif;
    font-size:.85rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--fg-muted); padding:10px 18px; border-radius:12px; cursor:pointer;
    border:1px solid var(--card-border); background: var(--card);
  }
  /* Con el editor de una actividad abierto la pestana no se puede oprimir:
     antes se mezclaba la lista de actividades ARRIBA y el editor ABAJO. */
  .tabs button:disabled{ opacity:.4; cursor:default; }
  .panel{ display:none; width:100%; max-width:520px; margin:0 0 16px;
    background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:18px; }
  .panel.ver{ display:block; }
  [hidden]{ display:none !important; }

  #alta{
    width:100%; max-width:420px; margin-bottom:10px;
  }
  #alta .fila{ display:flex; gap:10px; }
  #alta input{
    font-family:'Inter', sans-serif; flex:1; min-width:0;
    border-radius:12px; border:1px solid var(--card-border);
    background: var(--card); color:var(--fg);
    padding:14px; font-size:1rem;
  }
  #btnAgregar{
    font-family:'Chakra Petch', sans-serif; font-weight:700; letter-spacing:.04em;
    border:none; border-radius:14px; cursor:pointer; padding:14px 20px;
    color: var(--bg);
    background: linear-gradient(90deg, var(--coral), var(--teal));
    transition: transform .15s ease, opacity .2s ease;
    white-space:nowrap;
  }
  #btnAgregar:active{ transform: scale(.97); }
  #btnAgregar:disabled{ opacity:.4; }
  #btnAgregar.eliminar{ background: var(--rojo); color:#2b0410; }

  #msg{
    min-height:20px; font-size:.85rem; color:var(--rojo);
    margin:8px 0 16px; text-align:center; max-width:420px;
  }
  #msg.ok{ color: var(--teal); }

  #conteo{
    font-size:.8rem; color:var(--fg-muted); opacity:.8; margin-bottom:10px;
  }

  #lista{
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:10px;
  }
  .item{
    background: var(--card); border:1px solid var(--card-border);
    border-radius:12px; padding:14px 16px;
    font-family:'Chakra Petch', sans-serif; font-weight:600; font-size:1.02rem;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    cursor:pointer; width:100%; color:var(--fg); text-align:left;
    transition: transform .15s ease, border-color .2s ease;
  }
  .item:active{ transform: scale(.98); border-color: var(--teal); }
  .item.nube{ border-color: var(--teal); }
  .item .chev{ color:var(--fg-muted); font-size:1.2rem; }
  /* A la derecha del nombre: la pista de que aqui se abren los accesorios. */
  .item .pista{
    display:flex; align-items:center; gap:5px; flex-shrink:0;
    font-family:'Inter', system-ui, sans-serif; font-weight:600; font-size:.72rem;
    color:var(--fg-muted); background:rgba(47,217,199,.10);
    border:1px solid rgba(47,217,199,.30); border-radius:999px; padding:5px 10px;
    white-space:nowrap;
  }
  .item:active .pista{ color:var(--teal); border-color:var(--teal); }

  /* ---------- editor de preset (REEMPLAZA la lista, no se encima) ---------- */
  #zonaLista{ width:100%; max-width:520px; }
  #editorWrap{ display:none; width:100%; max-width:520px; }
  #editor{
    background: var(--card); border:1px solid var(--card-border);
    border-radius:16px; padding:20px; width:100%; max-width:520px;
  }
  #editor h2{ font-family:'Chakra Petch', sans-serif; font-size:1.25rem; margin:0 0 4px; }
  #origenPreset{
    font-size:.78rem; color:var(--fg-muted); margin-bottom:14px;
  }
  #origenPreset b{ color: var(--teal); }
  #checks{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .checkRow{
    display:flex; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--card-border);
    border-radius:10px; padding:10px 12px; font-size:.85rem;
  }
  .checkRow input{ width:auto; accent-color: var(--teal); }
  #editorMsg{ min-height:20px; font-size:.85rem; color:var(--rojo); margin-bottom:10px; }
  #editorMsg.ok{ color: var(--teal); }
  #editorBotones{ display:flex; gap:10px; flex-wrap:wrap; }
  #editorBotones button{ flex:1; min-width:120px; padding:15px; border:none; border-radius:14px;
    font-family:'Chakra Petch', sans-serif; font-weight:700; letter-spacing:.04em; cursor:pointer; }
  #btnGuardarPreset{ color: var(--bg); background: linear-gradient(90deg, var(--coral), var(--teal)); }
  #btnCerrarEditor{ background: var(--bg-2); color: var(--fg); border:1px solid var(--card-border); }
  /* Ir a la pantalla de Accesorios desde aqui, y volver a esta misma ventana. */
  #btnIrAccesorios{
    width:100%; margin:12px 0 2px; padding:14px; cursor:pointer;
    background: var(--card); color: var(--fg); border:1px solid var(--card-border);
    border-radius:14px; font-family:'Chakra Petch',sans-serif;
    font-weight:700; font-size:.95rem;
  }
  #btnIrAccesorios:active{ transform: scale(.98); border-color: var(--teal); }
  #btnIrAccesorios:disabled{ opacity:.5; }
  #editorBotones button:active{ transform: scale(.97); }
  #editorBotones button:disabled{ opacity:.4; }

  /* ---------- renombrar y eliminar (dentro del editor, ARRIBA) ----------
     Ahora van antes de los accesorios: antes iban al final con un borde
     ARRIBA, y quedaban escondidos debajo de todos los checkboxes. */
  #editorExtra{ margin:4px 0 18px; padding:0 0 18px; border-bottom:1px solid var(--card-border);
    display:flex; flex-direction:column; gap:10px; }
  #editorSub{ font-family:'Chakra Petch',sans-serif; font-size:.95rem; color:var(--fg-muted);
    margin:0 0 10px; font-weight:600; }
  #btnRenombrar, #btnEliminarAct{
    background:none; border:1px solid var(--card-border); border-radius:12px;
    color:var(--fg-muted); padding:13px; cursor:pointer;
    font-family:'Chakra Petch',sans-serif; font-weight:600; font-size:.92rem;
  }
  #btnRenombrar:active, #btnEliminarAct:active{ transform:scale(.98); }
  #btnEliminarAct{ color:var(--rojo); border-color:var(--rojo); }
  .filaInline{ display:none; gap:8px; flex-wrap:wrap; }
  .filaInline.ver{ display:flex; }
  .filaInline input{ flex:1; min-width:0; border-radius:12px; border:1px solid var(--card-border);
    background:var(--bg-2); color:var(--fg); padding:12px; font-size:.95rem; font-family:'Inter',sans-serif; }
  .filaInline button{ border:none; border-radius:12px; padding:12px 16px; cursor:pointer;
    font-family:'Chakra Petch',sans-serif; font-weight:700; }
  .btnChicoOk{ color:var(--bg); background:linear-gradient(90deg, var(--coral), var(--teal)); }
  .btnChicoNo{ background:var(--bg-2); color:var(--fg); border:1px solid var(--card-border) !important; }
  .avisoFuerte{ font-size:.85rem; color:var(--fg-muted); background:var(--bg-2);
    border:1px solid var(--rojo); border-radius:12px; padding:12px; line-height:1.5; text-align:left; }
  .avisoFuerte b{ color:var(--rojo); }
  .seccionCfg{ width:100%; max-width:520px; margin:30px 0 6px; text-align:center; }
  .seccionCfg h2{ font-family:'Chakra Petch',sans-serif; font-size:1.1rem; margin:0 0 6px; }
  .seccionCfg .mini{ font-size:.82rem; color:var(--fg-muted); margin:0 0 12px; }
  #listaUsuariosCfg{ display:flex; flex-direction:column; gap:10px; }
  #listaUsuariosCfg button{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; color:var(--fg); padding:12px; font-size:.95rem; font-family:'Chakra Petch',sans-serif; cursor:pointer; }
  #listaUsuariosCfg button.yo{ border-color:var(--teal); }
  #qrCajaCfg{ background:#fff; padding:12px; border-radius:14px; display:none; justify-content:center; margin:0 auto 12px; width:fit-content; }
  .btnCfg{ font-family:'Chakra Petch',sans-serif; font-weight:700; border:none; border-radius:12px; cursor:pointer; padding:12px 22px; color:var(--bg); background:linear-gradient(90deg, var(--coral), var(--teal)); }
  .btnCfg:active{ transform:scale(.97); }
  .filaCfg{ display:flex; gap:8px; margin-top:12px; }
  .filaCfg input{ flex:1; min-width:0; border-radius:12px; border:1px solid var(--card-border);
    background:var(--bg); color:var(--fg); padding:12px; font-size:.95rem; font-family:'Inter',sans-serif; }
</style>
</head>
<body>

<a class="back" href="../index.html">← Volver</a>

<div class="eyebrow">Configuración</div>
<h1 id="tituloCfg">Actividades y Accesorios</h1>
<p class="desc" id="descCfg">Elige una opción para configurar tu app.</p>

<div class="tabs">
  <button id="tabLista" type="button">Actividades</button>
  <a href="accesorios.html">Accesorios</a>
</div>

<div id="alta">
  <div class="fila">
    <input id="nombreNuevo" type="text" placeholder="Nombre de la actividad" maxlength="60" autocomplete="off">
    <button id="btnAgregar">Agregar</button>
  </div>
</div>

<div id="msg"></div>
<div id="conteo" hidden></div>
<div id="zonaLista">
  <div id="lista" hidden></div>

  <div id="editorWrap">
    <div id="editor">
      <h2 id="editorTitulo"></h2>
      <div id="origenPreset"></div>

      <!-- Cambiar nombre y Eliminar van PRIMERO. Antes quedaban al FINAL, debajo
      <!-- de todos los accesorios, y con muchas actividades se perdian de la vista. -->
      <div id="editorExtra">
        <button id="btnRenombrar" type="button">Cambiar nombre</button>
        <div class="filaInline" id="filaRenombrar">
          <input id="inputRenombrar" type="text" maxlength="60" autocomplete="off" placeholder="Nuevo nombre">
          <button class="btnChicoOk" id="btnRenombrarOk" type="button">Guardar nombre</button>
          <button class="btnChicoNo" id="btnRenombrarNo" type="button">Cancelar</button>
        </div>

        <button id="btnEliminarAct" type="button">Eliminar actividad</button>
        <div class="filaInline" id="filaEliminar" style="flex-direction:column;align-items:stretch;">
          <div class="avisoFuerte">
            Vas a eliminar <b id="borrarNombre"></b> <b>PARA SIEMPRE</b>.
            Se borran sus <b>accesorios</b>, sus <b>tomas</b> y sus <b>acciones de Guiadas</b>.
            Esto <b>no se puede deshacer</b>.
          </div>
          <input id="inputConfirmar" type="text" autocomplete="off" placeholder="Escribe el nombre para confirmar">
          <button class="btnChicoOk" id="btnEliminarOk" type="button" style="background:var(--rojo);color:#2b0410;">Eliminar definitivamente</button>
          <button class="btnChicoNo" id="btnEliminarNo" type="button">Cancelar</button>
        </div>
      </div>

      <h3 id="editorSub">Sus accesorios</h3>
      <div id="checks"></div>
      <button id="btnIrAccesorios" type="button">Administrar accesorios</button>
      <div id="editorMsg"></div>
      <div id="editorBotones">
        <button id="btnGuardarPreset">Guardar</button>
        <button id="btnCerrarEditor">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc, serverTimestamp,
  query, where
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

import firebaseConfigBase from "../firebase-config.js";
import { resolverFirebase, leerConfigGuardada, cargarUsuarios, asegurarFabrica } from "../config.js";
import { montarFavor } from "../favor.js";
try{ montarFavor(); }catch(e){}
const firebaseConfig = resolverFirebase(firebaseConfigBase);

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const actsRef = collection(db, "actividadesExtra");
const presetsRef = collection(db, "presetsActividad");
const extrasAccRef = collection(db, "accesoriosExtra");

// ====== ELEMENTOS ======
const listaEl = document.getElementById("lista");
const conteoEl = document.getElementById("conteo");
const msgEl = document.getElementById("msg");
const inputEl = document.getElementById("nombreNuevo");
const btnAgregar = document.getElementById("btnAgregar");

const editorWrap = document.getElementById("editorWrap");
const editorTitulo = document.getElementById("editorTitulo");
const origenPreset = document.getElementById("origenPreset");
const checksEl = document.getElementById("checks");
const editorMsg = document.getElementById("editorMsg");
const btnGuardarPreset = document.getElementById("btnGuardarPreset");
const btnIrAccesorios = document.getElementById("btnIrAccesorios");
const btnCerrarEditor = document.getElementById("btnCerrarEditor");

const btnRenombrar = document.getElementById("btnRenombrar");
const filaRenombrar = document.getElementById("filaRenombrar");
const inputRenombrar = document.getElementById("inputRenombrar");
const btnRenombrarOk = document.getElementById("btnRenombrarOk");
const btnRenombrarNo = document.getElementById("btnRenombrarNo");
const btnEliminarAct = document.getElementById("btnEliminarAct");
const filaEliminar = document.getElementById("filaEliminar");
const inputConfirmar = document.getElementById("inputConfirmar");
const btnEliminarOk = document.getElementById("btnEliminarOk");
const btnEliminarNo = document.getElementById("btnEliminarNo");
const borrarNombre = document.getElementById("borrarNombre");

// ====== ESTADO ======
let baseActs = [];   // del JSON: solo instalador; si ya se sembro, va vacio
let extrasActs = []; // de Firebase: [{id, nombre}] (todo se puede eliminar)
let catalogoAcc = []; // accesorios del JSON
let extrasAcc = [];   // accesorios extra de Firebase

let actividadEditando = null;
// ¿Esta abierto el editor de una actividad? Es una bandera de verdad y NO se
// pregunta por editorWrap.style.display: al abrir la pagina ese estilo de linea
// esta vacio (el display:none lo pone el CSS), asi que la comparacion daba
// "abierto" desde el arranque y la lista de actividades NUNCA se mostraba.
let editorAbierto = false;
// Lo que hay guardado en Firebase para la actividad que se está editando.
// Sirve para saber si marcaste algo sin guardar antes de irte a otra pantalla.
let accsGuardados = [];

function normalizar(s){
  return (s || "").trim().toLowerCase();
}

function listaActividades(){
  const vistos = new Set();
  const salida = [];
  baseActs.concat(extrasActs.map(e=>e.nombre)).forEach(n=>{
    const clave = normalizar(n);
    if(clave && !vistos.has(clave)){
      vistos.add(clave);
      salida.push(n.trim());
    }
  });
  return salida.sort((a,b)=>a.localeCompare(b,"es"));
}

function listaAccesorios(){
  const vistos = new Set();
  const salida = [];
  catalogoAcc.concat(extrasAcc).forEach(n=>{
    const clave = normalizar(n);
    if(clave && !vistos.has(clave)){
      vistos.add(clave);
      salida.push(n.trim());
    }
  });
  return salida.sort((a,b)=>a.localeCompare(b,"es"));
}

// ====== PANTALLA: LISTA ======
function pintar(){
  const todas = listaActividades();
  const nombresExtras = new Set(extrasActs.map(e=>normalizar(e.nombre)));
  listaEl.innerHTML = "";
  todas.forEach(n=>{
    const btn = document.createElement("button");
    btn.className = "item" + (nombresExtras.has(normalizar(n)) ? " nube" : "");
    const span = document.createElement("span");
    span.textContent = n;
    // La pista dice que al tocarla se abren los accesorios de esa actividad.
    const pista = document.createElement("span");
    pista.className = "pista";
    pista.textContent = "accesorios";
    const chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = "›";
    pista.appendChild(chev);
    btn.appendChild(span);
    btn.appendChild(pista);
    btn.onclick = ()=>abrirEditor(n);
    listaEl.appendChild(btn);
  });
  conteoEl.textContent = todas.length + (todas.length === 1 ? " actividad" : " actividades");
}

function avisar(texto, ok){
  msgEl.textContent = texto;
  msgEl.className = ok ? "ok" : "";
}

function actualizarModo(){
  const clave = normalizar(inputEl.value);

  // Este campo SOLO agrega. Antes, escribir el nombre exacto de una actividad
  // que ya existia convertia "Agregar" en "Eliminar": un tropiezo, porque uno
  // escribe para COMPROBAR si existe y de pronto borra algo. Ahora borrar se
  // hace nomas desde la lista, donde se ven los accesorios y hay que confirmar.
  btnAgregar.textContent = "Agregar";
  btnAgregar.classList.remove("eliminar");

  if(!clave){
    btnAgregar.disabled = true;          // vacío: no se puede agregar
    msgEl.textContent = "";
    msgEl.className = "";
    return;
  }

  if(listaActividades().some(n=>normalizar(n) === clave)){
    btnAgregar.disabled = true;          // ya existe: no se puede volver a agregar
    msgEl.textContent = "Esa actividad ya existe. Tócala en la lista para editarla o borrarla.";
    msgEl.className = "";
    return;
  }

  msgEl.textContent = "";
  msgEl.className = "";
  btnAgregar.disabled = false;           // nombre nuevo: sí
}

async function cargar(){
  // 1) La fabrica: los JSON del repo. Solo sirve para instalar.
  try{
    const r = await fetch("actividades.json");
    const data = await r.json();
    baseActs = Array.isArray(data) ? data : [];
  }catch(e){
    baseActs = [];
  }

  try{
    const r = await fetch("accesorios.json");
    const data = await r.json();
    catalogoAcc = Array.isArray(data) ? data : [];
  }catch(e){
    catalogoAcc = [];
  }

  // 2) Una sola vez se copia la fabrica a la base. Si ya quedo ahi, la base
  //    manda: lo de fabrica se vuelve tuyo y se renombra y borra de verdad.
  //    Si no se puede escribir, la fabrica sigue seindo lista de respaldo.
  const sembrado = await asegurarFabrica(db, { actividades: baseActs, accesorios: catalogoAcc });
  if(sembrado){
    baseActs = [];
    catalogoAcc = [];
  }

  // 3) Tu base, que ya incluye lo que se instalo.
  try{
    const snap = await getDocs(actsRef);
    extrasActs = [];
    snap.forEach(d=>{
      const n = d.data().nombre;
      if(n) extrasActs.push({ id: d.id, nombre: n });
    });
  }catch(e){
    extrasActs = [];
  }

  try{
    const snap = await getDocs(extrasAccRef);
    extrasAcc = [];
    snap.forEach(d=>{
      const n = d.data().nombre;
      if(n) extrasAcc.push(n);
    });
  }catch(e){
    extrasAcc = [];
  }

  pintar();
  actualizarModo();
}

async function agregar(){
  const nombre = inputEl.value.trim();
  if(!nombre){
    avisar("Escribe el nombre de la actividad.");
    return;
  }
  if(nombre.includes("/")){
    avisar("El nombre no puede contener /.");
    return;
  }

  const clave = normalizar(nombre);
  const existe = listaActividades().some(n=>normalizar(n) === clave);
  if(existe){
    avisar("Esa actividad ya existe.");
    return;
  }

  btnAgregar.disabled = true;
  try{
    const ref = await addDoc(actsRef, { nombre: nombre, creadoEn: serverTimestamp() });
    extrasActs.push({ id: ref.id, nombre: nombre });
    pintar();
    inputEl.value = "";
    inputEl.focus();
    actualizarModo();
    avisar("Actividad agregada.", true);
  }catch(e){
    avisar("No se pudo guardar. Revisa tu conexión.");
  }
  actualizarModo();   // decide si el botón queda activo o apagado
}

// ====== EDITOR DE PRESET ======
function editorAvisar(texto, ok){
  editorMsg.textContent = texto;
  editorMsg.className = ok ? "ok" : "";
}

function fuentePreset(nombre, hayNube, hayArchivo){
  if(hayNube && hayArchivo) return 'Accesorios <b>guardados</b> (sustituyen a los originales).';
  if(hayNube) return 'Accesorios <b>guardados</b>.';
  if(hayArchivo) return 'Accesorios <b>originales</b>. Guárdalos para personalizarlos.';
  return 'Sin accesorios definidos. Marca y guarda.';
}

async function abrirEditor(nombre){
  actividadEditando = nombre;
  editorTitulo.textContent = nombre;
  editorAvisar("", false);

  const todos = listaAccesorios();

  let nube = null;
  let archivo = null;
  try{
    const snap = await getDoc(doc(db, "presetsActividad", nombre));
    if(snap.exists() && Array.isArray(snap.data().accesorios)){
      nube = snap.data().accesorios;
    }
  }catch(e){ nube = null; }

  try{
    const r = await fetch(encodeURIComponent(nombre) + ".json");
    if(r.ok){
      const data = await r.json();
      archivo = Array.isArray(data) ? data : [];
    }
  }catch(e){ archivo = null; }

  const activos = new Set((nube || archivo || []).map(normalizar));
  accsGuardados = Array.from(activos);
  origenPreset.innerHTML = fuentePreset(nombre, !!nube, !!archivo);

  checksEl.innerHTML = "";
  todos.forEach(n=>{
    const label = document.createElement("label");
    label.className = "checkRow";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = n;
    input.checked = activos.has(normalizar(n));
    const span = document.createElement("span");
    span.textContent = n;
    label.appendChild(input);
    label.appendChild(span);
    checksEl.appendChild(label);
  });

  // El boton para ir a la pantalla de Accesorios siempre esta disponible.
  btnIrAccesorios.style.display = "";

  // Renombrar y eliminar: solo para las actividades creadas aquí (las de
  // fábrica son del catálogo y no se tocan).
  const esPropia = extrasActs.some(e=>e.nombre === nombre);
  btnRenombrar.style.display = esPropia ? "" : "none";
  btnEliminarAct.style.display = esPropia ? "" : "none";
  filaRenombrar.classList.remove("ver");
  filaEliminar.classList.remove("ver");
  inputRenombrar.value = "";
  inputConfirmar.value = "";
  borrarNombre.textContent = "«" + nombre + "»";

  // El editor REEMPLAZA la lista: así no se ve nada encimado.
  listaEl.hidden = true;
  editorWrap.style.display = "block";
  editorAbierto = true;
  // Con el editor abierto la pestana se apaga: si se oprime, la lista y el
  // editor quedaban mezclados y se podia guardar sobre la actividad equivocada.
  tabLista.disabled = true;
  try{ window.scrollTo(0, 0); }catch(e){}
}

function cerrarEditor(){
  editorWrap.style.display = "none";
  listaEl.hidden = false;
  actividadEditando = null;
  accsGuardados = [];
  editorAbierto = false;
  tabLista.disabled = false;
  filaRenombrar.classList.remove("ver");
  filaEliminar.classList.remove("ver");
}

async function guardarPreset(){
  if(!actividadEditando) return;
  const marcados = Array.from(checksEl.querySelectorAll("input:checked")).map(i=>i.value);

  btnGuardarPreset.disabled = true;
  try{
    await setDoc(doc(db, "presetsActividad", actividadEditando), {
      accesorios: marcados,
      actualizadoEn: serverTimestamp()
    });
    editorAvisar("Accesorios Guardados.", true);
    accsGuardados = marcados.slice();
    origenPreset.innerHTML = fuentePreset(actividadEditando, true, true);
  }catch(e){
    editorAvisar("No se pudo guardar. Revisa tu conexión.");
  }
  btnGuardarPreset.disabled = false;
}

// ¿Hay accesorios marcados que todavia NO estan guardados?
function hayCambiosSinGuardar(){
  const marcados = Array.from(checksEl.querySelectorAll("input:checked")).map(i=>i.value).sort();
  const guardados = accsGuardados.slice().sort();
  return marcados.length !== guardados.length || marcados.some((v,i)=> v !== guardados[i]);
}

// Ir a la pantalla de Accesorios sin perder lo marcado. Se guarda solo lo que
// haya cambiado, y se apunta de que actividad venimos para que al salir de
// alla se regrese a ESTE MISMO editor y se siga asignando.
async function irAAccesorios(){
  if(!actividadEditando) return;
  btnIrAccesorios.disabled = true;
  if(hayCambiosSinGuardar()) await guardarPreset();
  try{
    sessionStorage.setItem("citasIrAccesorios", JSON.stringify({ n: actividadEditando, t: Date.now() }));
  }catch(e){}
  location.href = "accesorios.html";
}

// Volver desde la pantalla de Accesorios: se reabre el editor de la misma
// actividad, ya con los accesorios frescos por si agregaste alguno nuevo.
async function volverDesdeAccesorios(){
  let vuelta = null;
  try{
    vuelta = JSON.parse(sessionStorage.getItem("citasIrAccesorios") || "null");
    sessionStorage.removeItem("citasIrAccesorios");
  }catch(e){}
  if(!vuelta || !vuelta.n) return;
  if(Date.now() - (vuelta.t || 0) > 21600000) return;   // mas de 6 h: ya no aplica

  tabLista.classList.add("activo");
  listaEl.hidden = false;
  conteoEl.hidden = false;
  document.getElementById("alta").style.display = "";

  if(!listaActividades().some(n=> n === vuelta.n)){
    avisar("Esa actividad ya no existe.");
    return;
  }
  await abrirEditor(vuelta.n);
  avisar("De vuelta en «" + vuelta.n + "».", true);
}

// ====== RENOMBRAR UNA ACTIVIDAD ======
// El nombre es la llave de los accesorios y de las acciones de Guiadas, asi
// que al cambiarlo hay que mover las tres cosas juntas. Si no, quedan huerfanas.
async function renombrarActividad(){
  if(!actividadEditando) return;
  const viejo = actividadEditando;
  const nuevo = inputRenombrar.value.trim();

  if(!nuevo){ editorAvisar("Escribe el nombre nuevo."); return; }
  if(nuevo.includes("/")){ editorAvisar("El nombre no puede contener /."); return; }
  if(normalizar(nuevo) === normalizar(viejo)){ editorAvisar("Es el mismo nombre."); return; }
  if(listaActividades().some(n=>normalizar(n) === normalizar(nuevo))){
    editorAvisar("Ya existe una actividad con ese nombre."); return;
  }
  const extra = extrasActs.find(e=>e.nombre === viejo);
  if(!extra){ editorAvisar("Esta actividad es de fabrica; no se puede renombrar."); return; }

  btnRenombrarOk.disabled = true;
  try{
    await setDoc(doc(db, "actividadesExtra", extra.id), { nombre: nuevo }, { merge: true });

    try{
      const ps = await getDoc(doc(db, "presetsActividad", viejo));
      if(ps.exists()){
        await setDoc(doc(db, "presetsActividad", nuevo), ps.data());
        await deleteDoc(doc(db, "presetsActividad", viejo));
      }
    }catch(e){}

    try{
      const nv = await getDoc(doc(db, "nivelesActividad", viejo));
      if(nv.exists()){
        await setDoc(doc(db, "nivelesActividad", nuevo), nv.data());
        await deleteDoc(doc(db, "nivelesActividad", viejo));
      }
    }catch(e){}

    try{
      const t = localStorage.getItem("guia_tomas_" + viejo);
      if(t !== null){
        localStorage.setItem("guia_tomas_" + nuevo, t);
        localStorage.removeItem("guia_tomas_" + viejo);
      }
    }catch(e){}

    // 4) Las citas ya agendadas guardan el nombre de la actividad en el campo
    // "actividad". Si no se actualizan, quedarian apuntando a un nombre que ya
    // no existe y al editarlas se cambiarian solas.
    try{
      const cs = await getDocs(query(collection(db, "citas"), where("actividad", "==", viejo)));
      const tareas = [];
      cs.forEach(d=>{ tareas.push(setDoc(doc(db, "citas", d.id), { actividad: nuevo }, { merge: true })); });
      await Promise.all(tareas);
    }catch(e){}

    extra.nombre = nuevo;
    actividadEditando = nuevo;
    editorTitulo.textContent = nuevo;
    borrarNombre.textContent = "«" + nuevo + "»";
    filaRenombrar.classList.remove("ver");
    inputRenombrar.value = "";
    pintar();
    editorAvisar("Nombre cambiado.", true);
  }catch(e){
    editorAvisar("No se pudo cambiar el nombre. Revisa tu conexion.");
  }
  btnRenombrarOk.disabled = false;
}

// ====== ELIMINAR UNA ACTIVIDAD (con todo y sus datos) ======
async function eliminarActividad(){
  if(!actividadEditando) return;
  const nombre = actividadEditando;

  if(normalizar(inputConfirmar.value) !== normalizar(nombre)){
    editorAvisar("Escribe el nombre para confirmar.");
    return;
  }
  const extra = extrasActs.find(e=>e.nombre === nombre);
  if(!extra){ editorAvisar("Esta actividad es de fabrica; no se puede eliminar."); return; }

  btnEliminarOk.disabled = true;
  try{
    await deleteDoc(doc(db, "actividadesExtra", extra.id));                       // la actividad
    try{ await deleteDoc(doc(db, "presetsActividad", nombre)); }catch(e){}        // sus accesorios
    try{ await deleteDoc(doc(db, "nivelesActividad", nombre)); }catch(e){}        // sus acciones de Guiadas
    try{ localStorage.removeItem("guia_tomas_" + nombre); }catch(e){}             // sus tomas (este telefono)
    extrasActs = extrasActs.filter(e=>e.id !== extra.id);
    cerrarEditor();
    pintar();
    inputEl.value = "";
    actualizarModo();
    avisar("Actividad eliminada con todo y sus datos.", true);
  }catch(e){
    editorAvisar("No se pudo eliminar. Revisa tu conexion.");
  }
  btnEliminarOk.disabled = false;
}

// ====== EVENTOS ======
// El boton de arriba SOLO agrega. Borrar una actividad se hace desde la lista:
// se toca, se ven sus accesorios y se confirma escribiendo el nombre.
btnAgregar.onclick = ()=>{ agregar(); };
inputEl.addEventListener("input", actualizarModo);
inputEl.addEventListener("keydown", e=>{
  if(e.key === "Enter") btnAgregar.onclick();
});

btnGuardarPreset.onclick = guardarPreset;
btnIrAccesorios.onclick = irAAccesorios;
btnCerrarEditor.onclick = cerrarEditor;

btnRenombrar.onclick = ()=>{
  filaEliminar.classList.remove("ver");
  filaRenombrar.classList.toggle("ver");
  if(filaRenombrar.classList.contains("ver")) inputRenombrar.focus();
};
btnRenombrarNo.onclick = ()=>{ filaRenombrar.classList.remove("ver"); inputRenombrar.value = ""; };
btnRenombrarOk.onclick = renombrarActividad;
inputRenombrar.addEventListener("keydown", e=>{ if(e.key === "Enter") renombrarActividad(); });

btnEliminarAct.onclick = ()=>{
  filaRenombrar.classList.remove("ver");
  filaEliminar.classList.toggle("ver");
  if(filaEliminar.classList.contains("ver")) inputConfirmar.focus();
};
btnEliminarNo.onclick = ()=>{ filaEliminar.classList.remove("ver"); inputConfirmar.value = ""; };
btnEliminarOk.onclick = eliminarActividad;
inputConfirmar.addEventListener("keydown", e=>{ if(e.key === "Enter") eliminarActividad(); });
editorWrap.addEventListener("click", e=>{
  if(e.target === editorWrap) cerrarEditor();
});

// ====== PANELES (lista) — Usuarios y Vincular viven en el ⚙️ del inicio ======
const tabLista = document.getElementById("tabLista");
function todosApagados(){
  [tabLista].forEach(b=>b.classList.remove("activo"));
  listaEl.hidden = true;
  conteoEl.hidden = true;
  document.getElementById("alta").style.display = "";
  document.getElementById("tituloCfg").textContent = "Actividades y Accesorios";
  document.getElementById("descCfg").textContent = "Elige una opción para configurar tu app.";
}
function ponerTitulo(t, d){
  document.getElementById("tituloCfg").textContent = t;
  document.getElementById("descCfg").textContent = d;
}
tabLista.onclick = ()=>{
  // Cinturon: con el editor abierto la pestana no hace nada.
  if(editorAbierto) return;
  const abierto = tabLista.classList.contains("activo");
  todosApagados();
  if(!abierto){
    tabLista.classList.add("activo");
    ponerTitulo("Actividades", "Agrega actividades nuevas. Toca una para elegir sus accesorios.");
    listaEl.hidden = false;
    conteoEl.hidden = false;
  }
};

// La pestana "Accesorios" de arriba: si el editor esta abierto, pasa por el
// mismo camino que el boton (guarda lo marcado y deja la nota de regreso).
const tabAccesorios = document.querySelector('.tabs a[href="accesorios.html"]');
if(tabAccesorios){
  tabAccesorios.onclick = e=>{
    if(editorAbierto && actividadEditando){ e.preventDefault(); irAAccesorios(); }
  };
}

cargar().then(volverDesdeAccesorios);
tabLista.onclick();
inputEl.focus();

</script>
